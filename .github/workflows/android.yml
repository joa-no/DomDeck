name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source-import.zip'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Import initial source package (one-time)
        if: ${{ hashFiles('source-import.zip') != '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          root = Path.cwd().resolve()
          with ZipFile("source-import.zip") as archive:
              for member in archive.infolist():
                  path = Path(member.filename)
                  if member.is_dir():
                      continue
                  if path.is_absolute() or ".." in path.parts or not path.parts:
                      raise ValueError(f"Unsafe archive member: {member.filename}")
                  if path.parts[0] in {".git", ".github"} or path.as_posix() in {"README.md", ".gitignore"}:
                      raise ValueError(f"Reserved archive member: {member.filename}")
                  target = (root / path).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError(f"Unsafe extraction path: {member.filename}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(member) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
          Path("source-import.zip").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import original DomDeck Android source from AI Studio"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug signing
        env:
          DOMDECK_DEBUG_KEYSTORE_BASE64: ${{ secrets.DOMDECK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DOMDECK_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DOMDECK_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Using repository signing secret."
          else
            echo "::warning::No persistent signing key configured. A temporary debug key will be used; this APK may require uninstalling previous builds."
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare downloadable APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/DomDeck-debug.apk
          test -s output/DomDeck-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DomDeck-debug-apk
          path: output/DomDeck-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DomDeck-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
