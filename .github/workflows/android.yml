name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Robolectric API 36 tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Preinstalled Android SDK manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug signing
        env:
          DOMDECK_DEBUG_KEYSTORE_BASE64: ${{ secrets.DOMDECK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DOMDECK_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DOMDECK_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Using repository signing secret."
          else
            echo "::warning::No persistent signing key configured. This debug APK cannot necessarily update earlier installations."
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare downloadable APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/DomDeck-debug.apk
          test -s output/DomDeck-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DomDeck-debug-apk
          path: output/DomDeck-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DomDeck-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
