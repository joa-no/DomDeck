name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Robolectric API 36 tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Preinstalled Android SDK manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Load and verify permanent DomDeck signing key
        shell: bash
        env:
          DOMDECK_KEYSTORE_BASE64: ${{ secrets.DOMDECK_KEYSTORE_BASE64 }}
          DOMDECK_SIGNING_PASSWORD: ${{ secrets.DOMDECK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DOMDECK_KEYSTORE_BASE64" ] || [ -z "$DOMDECK_SIGNING_PASSWORD" ]; then
            echo "::error::Configure DOMDECK_KEYSTORE_BASE64 and DOMDECK_SIGNING_PASSWORD in Settings > Secrets and variables > Actions before building."
            exit 1
          fi
          (umask 077; printf '%s' "$DOMDECK_KEYSTORE_BASE64" | base64 --decode > debug.keystore)
          test -s debug.keystore
          keytool -list -storetype PKCS12 -keystore debug.keystore -alias domdeck -storepass:env DOMDECK_SIGNING_PASSWORD >/dev/null
          echo "DomDeck signing key loaded successfully."

      - name: Run unit tests and build debug APK
        env:
          DOMDECK_SIGNING_PASSWORD: ${{ secrets.DOMDECK_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare downloadable APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/DomDeck-debug.apk
          test -s output/DomDeck-debug.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs output/DomDeck-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DomDeck-debug-apk
          path: output/DomDeck-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DomDeck-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
